name: Test F1 Standings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate F1 standings
        run: python scripts/generate_f1_standings.py

      - name: Upload BMP for testing
        uses: actions/upload-artifact@v4
        with:
          name: f1-test-image
          path: docs/current.bmp
