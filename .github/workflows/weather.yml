name: Update Weather Image

on:
  schedule:
    - cron: "2/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate weather image
        run: python scripts/generate_weather.py

      - name: Commit and push if image changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/weather.bmp

          git diff --staged --quiet || git commit -m "Update weather image [skip ci]"

          git push
